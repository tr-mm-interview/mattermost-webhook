name: Post Hello World to Mattermost

on:
  workflow_dispatch:

jobs:
  post-message:
    runs-on: ubuntu-latest

    steps:
      - name: Hello world to Mattermost
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H 'Content-Type: application/json' \
            -d '{"text":"Hello world"}' \
            "$MATTERMOST_WEBHOOK_URL"
