name: Post Hello World to Mattermost

on:
  workflow_dispatch:

jobs:
  post-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send hello world to Mattermost
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H 'Content-Type: application/json' \
            -d '{
              "username": "Bender",
              "icon_url": "https://static.wikia.nocookie.net/enfuturama/images/0/0a/Bender_Rodriguez.png",
              "text": "Hello world"
            }' \
            "$MATTERMOST_WEBHOOK_URL"
